name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-validate:
    name: Lint & Validation
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
              Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -AllowClobber -SkipPublisherCheck
          }

      - name: Run Pre-Commit Checks & AST Validation
        shell: pwsh
        run: |
          & .\.githooks\pre-commit.ps1

      - name: Run PSScriptAnalyzer Error Check
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer
          $errors = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          if ($errors) {
              $errors | Format-Table ScriptName, Line, RuleName, Message -AutoSize
              Write-Host "PSScriptAnalyzer found errors." -ForegroundColor Red
              exit 1
          }
          else {
              Write-Host "PSScriptAnalyzer passed with 0 critical errors." -ForegroundColor Green
          }

  dry-run-test:
    name: Windows Dry-Run Test
    runs-on: windows-latest
    needs: lint-and-validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Setup in DryRun Mode
        shell: pwsh
        run: |
          .\setup.ps1 -DryRun -SkipElevationCheck

      - name: Test Specific Components
        shell: pwsh
        run: |
          .\setup.ps1 -DryRun -Components git,vscode,terminal,powershell,mamba -SkipElevationCheck

      - name: Test Uninstaller in DryRun Mode
        shell: pwsh
        run: |
          .\uninstall.ps1 -DryRun -SkipElevationCheck
